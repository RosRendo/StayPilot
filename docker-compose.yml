services:
  postgres:
    image: postgres:16-alpine
    container_name: staypilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: staypilot
      POSTGRES_PASSWORD: staypilot_dev_password
      POSTGRES_DB: staypilot_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staypilot -d staypilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
